<svg xmlns="http://www.w3.org/2000/svg" width="640" height="215" viewBox="0 0 640 215" role="img" aria-labelledby="t d"><title id="t">PROGRESS, IN THE OPEN. Live badges, charts, milestones and difficulty tables.</title><desc id="d">PROGRESS, IN THE OPEN. Live badges, charts, milestones and difficulty tables. Conceptual algorithm illustration, not a solved-problem count, benchmark or application screenshot.</desc><style>@keyframes visit{0%,100%{opacity:.35}40%,65%{opacity:1}}.visit{animation:visit 9s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.visit,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><path d="M28 13H612" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(30 39) scale(0.9545454545454546)"><path d="M4 10h36M4 34h36M14 4v12M31 27l-11 13M20 27l11 13" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="94" y="74" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#F8F8F3" font-weight="600" >PROGRESS, IN THE OPEN</text><text x="32" y="126" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#BCFCF6" font-weight="400" >Live badges, charts, milestones and</text><text x="32" y="158" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#BCFCF6" font-weight="400" >difficulty tables.</text><circle cx="608" cy="195" r="4" fill="#F3D962" class="pulse"/></svg>